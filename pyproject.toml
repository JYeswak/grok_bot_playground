# pyproject.toml — the PUBLIC tree's packaging metadata.
#
# WHY THIS LIVES IN `packaging/` AND NOT AT THE REPO ROOT. This repo is an INSTANCE: it holds a
# live account's inventory, deployment snapshots, findings and fleet spec, none of which is
# publishable and none of which is part of the tool. A root `pyproject.toml` would declare the
# instance to be the distributable, and `pip install -e .` run here would install a package whose
# tree is full of a specific account's artifacts. `bin/gb-export-public.py` copies this file to
# the root OF THE EXPORT, where the root genuinely is the package — the tool, and nothing else.
#
# NO REQUIRED RUNTIME DEPENDENCIES. `dependencies = []` is a claim, so the exporter checks it:
# it resolves every top-level import across the exported Python against this interpreter's
# stdlib. There is exactly one declared exception, the `inventory` extra below, and the
# exporter additionally refuses to publish a tree where that import is not deferred into the
# single function that needs it.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-bot-ops"
version = "1.0.0"
description = "gb — an operator CLI for a Grok Bot deployment: triage, doctor, health, repair, and a 24-check surface gate."
readme = "README.md"
# 3.9 is the floor because it is the interpreter this tool is measured on, not an aspiration.
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["grok", "cli", "operations", "agent-tooling", "gate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# `bin/gbrpc.py` decrypts the desktop client's own safeStorage v10 blob (AES-CBC, which the
# standard library does not provide) to read the access token, and `bin/gb-pull-inventory.py`
# does the same for the local inventory replica.
#
# THE LINE THAT USED TO STAND HERE WAS FALSE, and a real install said so. It read: "the import
# lives inside `decrypt()`, so nothing else in the tool notices its absence — including `gb`
# itself." Measured 2026-09-12 by invoking all 54 advertised verbs for real against a bare
# `pip install` of this tree, TWO of them notice it by crashing rather than refusing:
#
#   gb fleet     ModuleNotFoundError: No module named 'cryptography'  (bin/gbrpc.py:99), relayed
#                as a traceback with exit 1 instead of ENVIRONMENT
#   gb mcp list  NameError: name 'fail' is not defined (bin/gb-mcp.py:398) — the handler that
#                exists to report "no client session" is itself dead, so the credential failure
#                is reported by a second crash
#
# Isolated, not guessed: the same two verbs both exited 0 on an install of this same tree with
# the extra (`pip install '.[inventory]'`), so the cause was the deferred import and not the
# payload. `gb inventory` was the one caller that already caught it and reported exit 3 with
# the module named, which is the shape the other two owed the operator.
#
# BOTH ARE FIXED IN THE PRODUCERS, same day, and re-measured here: a fresh export installed
# bare now answers `gb fleet` with "reading the desktop's own credential needs the optional
# `cryptography` package ... install it with `pip install 'grok-bot-ops[inventory]'`" and
# `gb mcp list` with `no client session: No module named 'cryptography'` at exit 3. Zero of the
# 57 advertised verbs answer with a traceback. The comment stays because the FALSE claim is
# what it guards against: the import being deferred is not the same fact as nothing noticing.
inventory = ["cryptography"]

[project.scripts]
# `bin/gb` is extensionless and therefore unnameable here; `grok_bot_ops.cli` is a five-line
# shim that runs it. See packaging/grok_bot_ops/cli.py for why that is the shape.
gb = "grok_bot_ops.cli:main"

[tool.setuptools]
include-package-data = false

# THE PAYLOAD IS DECLARED ONCE — BY THIS MAPPING — AND THE MODULE LIST IS DERIVED FROM IT.
#
# A hand-written module list used to sit above this table, naming `grok_bot_ops` and
# `grok_bot_ops.bin` a second time. Two statements of one fact, and the one that decides what a
# wheel CONTAINS is the mapping: a name in the list with no mapping ships nothing, and a mapping
# missing from the list is silently dropped. setuptools >= 61 reads a `package-dir` whose keys
# are not `""` as an EXPLICIT layout and walks each mapped directory to derive the list itself
# (`setuptools.discovery.ConfigDiscovery._analyse_explicit_layout`). MEASURED, not assumed, on
# 2026-09-12 against the same export tree built twice: the two wheels' file lists are identical
# — 72 entries each, 64 of them payload at that time — and the only difference anywhere is the
# two deliberately planted files described below. Verified at the declared floor too: built
# under `setuptools==61.0.0` in a clean venv, not only under the latest.
[tool.setuptools.package-dir]
"grok_bot_ops" = "grok_bot_ops"
# The top-level `bin/` IS the payload. Mapping it in place keeps one copy of every producer:
# the file a contributor edits after `git clone` is the file pip installs.
"grok_bot_ops.bin" = "bin"

[tool.setuptools.package-data]
# `*`, AND NOT A SUFFIX LIST, because a suffix list is a guess about the future that fails
# green. `["gb", "*.sh"]` stood here and shipped the right files only because every producer
# added since happened to end in `.py` — the extensionless `gb` already had to be named by
# hand, and the next extensionless producer, or any data file a producer reads, would have been
# left out of the wheel by a build that reported success. Demonstrated as a known-bad before
# this line changed: with the suffix list, a planted `bin/gb-thing` and `bin/gb-thing.json` are
# absent from the wheel while every `.py` beside them ships. `bin/` in the exported tree holds
# nothing but the tool, so `*` has no wider blast radius than the list it replaces.
"grok_bot_ops.bin" = ["*"]
