name: First-run / UX
description: Something about the front door is confusing, buried, or unwelcoming
title: "ux: "
labels: ["ux", "enhancement"]
body:
  - type: dropdown
    id: seat
    attributes:
      label: Who hit this
      options:
        - New to Grok Bot
        - Founder
        - Engineer
        - Product manager
        - Sales / SDR
        - Support / post-sales
        - Marketing
        - Operator already running gb
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you tried to do
      placeholder: I opened the README because I was watching the Engineering session and wanted a Bot I could paste.
    validations:
      required: true
  - type: textarea
    id: stuck
    attributes:
      label: Where it went wrong
      placeholder: The first screen was a 58-verb table. I could not tell which charter was mine.
    validations:
      required: true
